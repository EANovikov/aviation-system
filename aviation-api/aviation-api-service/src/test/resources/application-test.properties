spring.application.name=aviation-api

# Airport client configuration
airport.client.enabled=true
airport.client.retry.delay=200
airport.client.retry.maxDelay=2000
airport.client.retry.maxAttempts=3

spring.cloud.openfeign.client.config.airport-client.url=https://api.aviationapi.com/v1/
spring.cloud.openfeign.client.config.airport-client.connectTimeout=5000
spring.cloud.openfeign.client.config.airport-client.readTimeout=5000
spring.cloud.openfeign.client.config.airport-client.loggerLevel=full
spring.cloud.openfeign.client.config.airport-client.micrometer.enabled=true

logging.level.com.xevgnov.aviation.client.AviationAirportClient=DEBUG
feign.client.config.default.loggerLevel=full

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# OTLP Exporter configuration
otel.exporter.otlp.endpoint=http://localhost:4318
otel.exporter.otlp.protocol=http/protobuf
otel.logs.exporter=none
otel.metrics.exporter=none
logging.config=classpath:logback.xml